[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-lightbox"
version = "0.1.0"
description = "Static gallery builder for neuro study results (formerly source-lightbox)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pillow>=10.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
neuro-lightbox = "neuro_lightbox.cli:main"
# The old name, for scripts that still call it (deprecated; says so on stderr).
source-lightbox = "neuro_lightbox.cli:deprecated_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuro_lightbox = ["templates/*.j2", "static/**/*", "profiles/*/static/*"]
