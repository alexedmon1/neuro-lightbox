# nginx site for hosting neuro-lightbox galleries on a LAN workstation.
#
# Install:
#   sudo cp nginx-galleries.conf /etc/nginx/sites-available/galleries
#   sudo ln -s /etc/nginx/sites-available/galleries /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default     # drop the stock default site
#   sudo nginx -t && sudo systemctl reload nginx
#
# Galleries are fully static (manifest inlined, all paths relative), so they host
# cleanly under a sub-path via `alias`. EDIT the paths below (placeholders:
# /mnt/results/study-a ...). Add a `location /<name>/ { ... }` block per gallery.
#
# A gallery whose study.yaml has `links:` (e.g. the preprocessing QC index) links to
# pages outside its own folder, relative to it. Serve the study's whole folder, as
# study-a below does, so those links resolve; serving only the gallery folder (as
# study-b) is enough for a gallery without links.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                      # responds on the workstation's IP/hostname

    # Landing page that links to each gallery (see deploy/landing.html).
    root /srv/galleries;
    index index.html;
    autoindex off;

    # ---- Study A: the whole study folder, gallery at /study-a/analyses/gallery/
    location = /study-a { return 301 /study-a/analyses/gallery/; }
    location /study-a/ {
        alias /mnt/results/study-a/;
        index index.html;
    }

    # ---- Study B: only its gallery folder
    location = /study-b { return 301 /study-b/; }
    location /study-b/ {
        alias /mnt/results/study-b/gallery/;
        index index.html;
    }

    # Optional LAN password (uncomment + create the file):
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd labuser
    # auth_basic           "Result galleries";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
