# Apache 2.4 site for hosting neuro-lightbox galleries on a LAN workstation.
#
# Install:
#   sudo cp apache-galleries.conf /etc/apache2/sites-available/galleries.conf
#   sudo a2ensite galleries
#   sudo a2dissite 000-default                       # drop the stock default site
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Galleries are fully static (manifest inlined, all paths relative), so they host
# cleanly under a sub-path via Alias. EDIT the paths below (placeholders:
# /mnt/results/study-a ...). Add an Alias + <Directory> pair per gallery. mod_alias
# and mod_dir are enabled by default.
#
# A gallery whose study.yaml has `links:` (e.g. the preprocessing QC index) links to
# pages outside its own folder, relative to it. Serve the study's whole folder, as
# study-a below does, so those links resolve; serving only the gallery folder (as
# study-b) is enough for a gallery without links.

<VirtualHost *:80>
    ServerName _                        # responds on the workstation's IP/hostname

    # Landing page that links to each gallery (see deploy/landing.html).
    DocumentRoot /srv/galleries
    DirectoryIndex index.html

    <Directory /srv/galleries>
        Require all granted
        Options -Indexes
    </Directory>

    # ---- Study A: the whole study folder, gallery at /study-a/analyses/gallery/
    RedirectMatch ^/study-a/?$ /study-a/analyses/gallery/
    Alias /study-a /mnt/results/study-a
    <Directory /mnt/results/study-a>
        Require all granted
        Options -Indexes
        DirectoryIndex index.html
    </Directory>

    # ---- Study B: only its gallery folder
    Alias /study-b /mnt/results/study-b/gallery
    <Directory /mnt/results/study-b/gallery>
        Require all granted
        Options -Indexes
        DirectoryIndex index.html
    </Directory>

    # Optional LAN password (uncomment + create the file):
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/apache2/.htpasswd labuser
    # <Location />
    #     AuthType Basic
    #     AuthName "Result galleries"
    #     AuthUserFile /etc/apache2/.htpasswd
    #     Require valid-user
    # </Location>
</VirtualHost>
