# Golden-build fixture, cut from the FORGE treatment study config by
# tests/fixtures/make_fixtures.py. Only the keys the gallery reads.
name: FORGE FXS Study — Treatment, Monte Carlo volumetric ROI (Allen26)
gallery_title: FORGE — Mouse FXS AAV Treatment (MC volumetric)
exclude_analyses:
- roi_network
groups:
  KO_VEH: KO Vehicle
  WT_VEH: WT Vehicle
  KO_HD_ICV: KO High-Dose ICV
  KO_HD_IV: KO High-Dose IV
  KO_LD_IV_ICV: KO Low-Dose IV+ICV
group_order:
- WT_VEH
- KO_VEH
- KO_HD_ICV
- KO_HD_IV
- KO_LD_IV_ICV
hypotheses:
- name: group_omnibus
  kind: omnibus
  label: Omnibus (all groups)
  role: phenotype
- name: disease_effect
  kind: contrast
  label: Disease effect (KO vs WT)
  weights:
    KO_VEH: 1
    WT_VEH: -1
  role: phenotype
- name: hd_icv_rescue
  kind: contrast
  label: HD-ICV rescue (vs KO veh)
  weights:
    KO_HD_ICV: 1
    KO_VEH: -1
  role: rescue
- name: hd_iv_rescue
  kind: contrast
  label: HD-IV rescue (vs KO veh)
  weights:
    KO_HD_IV: 1
    KO_VEH: -1
  role: rescue
- name: ld_rescue
  kind: contrast
  label: LD-IV+ICV rescue (vs KO veh)
  weights:
    KO_LD_IV_ICV: 1
    KO_VEH: -1
  role: rescue
- name: hd_icv_normalization
  kind: equivalence
  label: HD-ICV normalization to WT
  weights:
    KO_HD_ICV: 1
    WT_VEH: -1
  margin:
    mode: sd
    value: 0.25
  role: normalization
- name: hd_iv_normalization
  kind: equivalence
  label: HD-IV normalization to WT
  weights:
    KO_HD_IV: 1
    WT_VEH: -1
  margin:
    mode: sd
    value: 0.25
  role: normalization
- name: ld_normalization
  kind: equivalence
  label: LD-IV+ICV normalization to WT
  weights:
    KO_LD_IV_ICV: 1
    WT_VEH: -1
  margin:
    mode: sd
    value: 0.25
  role: normalization
- name: route_comparison
  kind: contrast
  label: 'Route: HD-ICV vs HD-IV'
  weights:
    KO_HD_ICV: 1
    KO_HD_IV: -1
  role: exploratory
- name: dose_icv
  kind: contrast
  label: 'Dose: HD-ICV vs LD-IV+ICV'
  weights:
    KO_HD_ICV: 1
    KO_LD_IV_ICV: -1
  role: exploratory
- name: dose_iv
  kind: contrast
  label: 'Dose: HD-IV vs LD-IV+ICV'
  weights:
    KO_HD_IV: 1
    KO_LD_IV_ICV: -1
  role: exploratory
circos_metrics:
- imag_coherence
- dwpli
- pli
- aec
- coherence
roi_categories:
  Frontal-Anterior:
  - Frontal_Anterior
  Motor:
  - Motor_L
  - Motor_R
  Somatosensory:
  - Somatosensory_L
  - Somatosensory_R
  Auditory:
  - Auditory_L
  - Auditory_R
  Visual/Parietal:
  - Visual_Parietal_L
  - Visual_Parietal_R
  Lateral Cortex:
  - Lateral_Cortex_L
  - Lateral_Cortex_R
  Retrosplenial:
  - Retrosplenial_L
  - Retrosplenial_R
  Olfactory:
  - Olfactory_Bulb
  Hippocampal:
  - Hippocampus_Ant_L
  - Hippocampus_Ant_R
  - Hippocampus_Post_L
  - Hippocampus_Post_R
  Deep Subcortical:
  - Thalamus
  - Hypothalamus
  - Amygdalar_Complex_L
  - Amygdalar_Complex_R
  - Basal_Ganglia_L
  - Basal_Ganglia_R
  - Brainstem_Tectum
  - Cerebellum
pipeline:
  atlas: allen26
paths:
  results: ./results
  analytics: ./analytics
  gallery: ./gallery
  localizations:
  - path: ./localization/rest_roi_allen26
    label: ROI-based (Allen26)
  - path: ./localization/rest_shell_mc
    label: MC Shell
  source_analytics_python: ./sa_python
paradigms:
  roi_based:
    display:
      group: Resting
      label: ROI-based (fixed placement)
  shell_mc:
    display:
      group: Resting
      label: MC volumetric (shell)
  cartesian_mc:
    display:
      group: Resting
      label: MC volumetric (cartesian)
