name: Legacy outputs (fixture)
include_retired: true
exclude_analyses: []
groups:
- name: WT_VEH
  label: WT Vehicle
- name: KO_VEH
  label: KO Vehicle
- name: KO_HD_ICV
  label: KO High-Dose ICV
